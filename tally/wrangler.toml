name = "swiperight-tally"
main = "worker.js"
compatibility_date = "2025-10-01"

[[d1_databases]]
binding = "DB"
database_name = "swiperight-tally"
database_id = "1d654fe5-5ae5-41dc-8188-7cfae48ef6ac"

# Per-IP limit on submissions (Workers Rate Limiting API), loose enough for a shared school or office IP.
# Best-effort; the IP is never stored.
[[ratelimits]]
name = "IP_LIMIT"
namespace_id = "2001"
simple = { limit = 20, period = 60 }
